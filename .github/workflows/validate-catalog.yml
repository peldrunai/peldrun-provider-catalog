# .github/workflows/validate-catalog.yml
name: Validate Catalog

on:
  push:
    branches: [main]
    paths:
      - "catalog.json"
      - "schema/**"
      - "scripts/**"
      - ".github/workflows/validate-catalog.yml"
  pull_request:
    branches: [main]
    paths:
      - "catalog.json"
      - "schema/**"
      - "scripts/**"
      - ".github/workflows/validate-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate catalog.json
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Fail fast if the repository layout is broken. This step has no
      # continue-on-error: a missing file is an infrastructure problem,
      # not a catalog-content problem, so we abort before running any
      # check that would just cascade-fail.
      - name: Verify required files exist
        run: |
          set -euo pipefail
          missing=0
          for f in catalog.json schema/catalog.schema.json scripts/validate.py scripts/fix_hashes_from_github.py; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required file is missing"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema==4.23.0

      # The following content checks are independent and must ALL run
      # even when one of them fails, so the contributor sees every
      # problem in a single CI run (matching the "collect all errors in
      # one pass" contract documented in scripts/validate.py). Each one
      # records its outcome via `continue-on-error: true` + `id`, and
      # the final "Aggregate" step fails the job if any of them failed.

      - name: Run structural validator
        id: structural
        continue-on-error: true
        run: python scripts/validate.py

      - name: Run JSON Schema validation
        id: schema
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          from jsonschema import Draft7Validator, FormatChecker

          catalog_path = Path("catalog.json")
          schema_path = Path("schema/catalog.schema.json")

          try:
              catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"::error file={catalog_path}::Failed to parse: {exc}")
              sys.exit(1)

          try:
              schema = json.loads(schema_path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"::error file={schema_path}::Failed to parse: {exc}")
              sys.exit(1)

          # FormatChecker is required - without it jsonschema silently
          # ignores every "format" keyword (uri, date-time, ...).
          validator = Draft7Validator(schema, format_checker=FormatChecker())
          errors = sorted(
              validator.iter_errors(catalog),
              key=lambda e: [str(p) for p in e.path],
          )

          if not errors:
              print("Schema validation passed.")
              sys.exit(0)

          for err in errors:
              location = ".".join(str(p) for p in err.absolute_path) or "<root>"
              print(
                  f"::error file={catalog_path}::"
                  f"{location}: {err.message}"
              )
          sys.exit(1)
          PY

      - name: Check for trailing whitespace
        id: whitespace
        continue-on-error: true
        run: |
          set -euo pipefail
          if grep -nP '[ \t]+$' catalog.json schema/catalog.schema.json; then
            echo "::error::Trailing whitespace detected in JSON files"
            exit 1
          fi

      - name: Check for CRLF line endings
        id: crlf
        continue-on-error: true
        run: |
          set -euo pipefail
          if grep -q $'\r' catalog.json schema/catalog.schema.json 2>/dev/null; then
            echo "::error::CRLF line endings detected. Use LF only."
            exit 1
          fi

      - name: Ensure file ends with newline
        id: newline
        continue-on-error: true
        run: |
          set -euo pipefail
          # `od` is POSIX; `xxd` is not guaranteed on every runner.
          for f in catalog.json schema/catalog.schema.json; do
            if [ -s "$f" ]; then
              # od -An -tx1 emits the byte as " 0a" followed by a
              # newline. `tr -d ' \n'` does NOT strip the newline
              # (tr does not interpret escape sequences). Use
              # [:space:] which correctly trims all whitespace.
              last_byte=$(tail -c 1 "$f" | od -An -tx1 | tr -d '[:space:]')
              if [ "$last_byte" != "0a" ]; then
                echo "::error file=$f::File does not end with a newline"
                exit 1
              fi
            fi
          done

      # Optional network-based integrity check.
      # Runs ONLY on manual dispatch (workflow_dispatch) so that:
      #   - ordinary PRs stay fast and never depend on github.com being up;
      #   - the contents of the packages change far more often than
      #     catalog.json itself, so a mismatch discovered here means
      #     "the release was re-published under the same URL" and should
      #     be fixed deliberately by a maintainer, not on every push.
      # A non-zero exit from fix_hashes_from_github.py (--check) means
      # at least one catalog item's checksum_sha256 does not match the
      # bytes actually served at its download_url, or a package could
      # not be fetched.
      - name: Verify checksums against remote packages
        id: checksums
        if: github.event_name == 'workflow_dispatch'
        run: |
          python scripts/fix_hashes_from_github.py \
            --check \
            --strict-zip \
            --timeout 30 \
            --retries 2

      # Single source of truth for the job's pass/fail decision: the
      # check steps above intentionally never fail the workflow on their
      # own (continue-on-error: true) so we can report all problems at
      # once. This step turns their recorded outcomes into the final
      # exit code.
      - name: Aggregate validation results
        env:
          OUTCOME_STRUCTURAL: ${{ steps.structural.outcome }}
          OUTCOME_SCHEMA: ${{ steps.schema.outcome }}
          OUTCOME_WHITESPACE: ${{ steps.whitespace.outcome }}
          OUTCOME_CRLF: ${{ steps.crlf.outcome }}
          OUTCOME_NEWLINE: ${{ steps.newline.outcome }}
          OUTCOME_CHECKSUMS: ${{ steps.checksums.outcome }}
        run: |
          set -uo pipefail
          failed=0
          for name in STRUCTURAL SCHEMA WHITESPACE CRLF NEWLINE CHECKSUMS; do
            var="OUTCOME_${name}"
            outcome="${!var}"
            if [ "$outcome" = "failure" ]; then
              echo "::error::Validation check '${name}' failed. See the step log above."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Summary
        if: success()
        run: |
          {
            echo "## Catalog validation passed"
            echo ""
            echo "- Structural checks: **OK**"
            echo "- JSON Schema checks: **OK**"
            echo "- Formatting checks:  **OK**"
            echo ""
            echo "Commit: \`${GITHUB_SHA::7}\`"
            echo "Ref:    \`${GITHUB_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"
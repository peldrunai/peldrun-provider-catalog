# .github/workflows/import-provider.yml
name: Import Provider to Catalog

on:
  workflow_dispatch:
    inputs:
      entry_url:
        description: 'URL to the remote catalog-entry.json'
        required: true
        type: string
      provider_id:
        description: 'Optional: Provider ID (e.g. cloudflare-ai) for the PR branch name'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run import script
        run: |
          python scripts/import_catalog_entry.py \
            --url "${{ inputs.entry_url }}" \
            --catalog catalog.json

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          # Use the provider_id input if provided, else derive from URL
          branch: add-provider-${{ inputs.provider_id || github.run_id }}
          title: "feat(catalog): add provider from ${{ inputs.entry_url }}"
          commit-message: "feat(catalog): import new provider"
          body: |
            This PR was automatically generated by the `Import Provider to Catalog` workflow.

            **Source URL:**
            `${{ inputs.entry_url }}`

            Please verify:
            - [ ] The provider details are correct.
            - [ ] The SHA-256 checksum is valid.
          delete-branch: true